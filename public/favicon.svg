<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062e1b"/>
      <stop offset="100%" stop-color="#02140c"/>
    </linearGradient>

    <!-- Swing Arc Gradient (Fairway Emerald to Golden Pin) -->
    <linearGradient id="swingArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Ball Gradient -->
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#166534" stroke-width="1.5"/>

  <!-- Speed Arc 1 (Outer Aero Trail) -->
  <path d="M 12 44 C 11 26 24 13 42 12" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 4" opacity="0.4"/>

  <!-- Main Dynamic Swing Trajectory Arc (Cradling the Golf Ball) -->
  <path d="M 14 47 C 12 30 25 15 45 15 C 51 15 54 18 53 22 C 51 29 39 36 29 42 C 22 46 17 50 15 52" 
        stroke="url(#swingArc)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Golf Ball (Sitting in the Impact Zone) -->
  <circle cx="36" cy="27" r="10" fill="url(#ballGrad)" stroke="#e2e8f0" stroke-width="1" filter="url(#glow)"/>

  <!-- Golf Ball Dimple Details -->
  <circle cx="33" cy="24" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="37" cy="23" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="35" cy="27" r="1.1" fill="#94a3b8" opacity="0.7"/>
  <circle cx="39" cy="27" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="33" cy="30" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="37" cy="31" r="1" fill="#94a3b8" opacity="0.6"/>

  <!-- Apex Sweet Spot Spark in Warm Gold -->
  <path d="M 49 14 L 51 19 L 56 19 L 52 22 L 54 27 L 49 24 L 44 27 L 46 22 L 42 19 L 47 19 Z" 
        fill="#f59e0b" transform="scale(0.5) translate(46, 8)"/>
</svg>